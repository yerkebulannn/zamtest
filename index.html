<!DOCTYPE html>

<head>

<title>Тренажёр: почерк и ТЭД</title>
<style>
:root{--bg:#f6f4ef;--card:#fffdf8;--ink:#1d2a33;--mute:#667780;--line:#d9d4c8;--acc:#1f4e5f;--accfg:#fff;--ok:#1d7a4d;--okbg:#e0f1e6;--bad:#b3362b;--badbg:#f8e1de;--warn:#8a6100;--warnbg:#fbf0d0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13191d;--card:#1b2429;--ink:#e6ebee;--mute:#93a3ab;--line:#2f3c43;--acc:#7cc0d4;--accfg:#0d1a20;--ok:#6fd09b;--okbg:#17352a;--bad:#ff8f84;--badbg:#3b1d1a;--warn:#e8c46a;--warnbg:#3a2f12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13191d;--card:#1b2429;--ink:#e6ebee;--mute:#93a3ab;--line:#2f3c43;--acc:#7cc0d4;--accfg:#0d1a20;--ok:#6fd09b;--okbg:#17352a;--bad:#ff8f84;--badbg:#3b1d1a;--warn:#e8c46a;--warnbg:#3a2f12;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font:600 26px/1.2 Georgia,"Times New Roman",serif;margin:8px 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 14px;margin-bottom:16px}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row input{width:20px;height:20px;accent-color:var(--acc);flex:none}
.row .t{flex:1;min-width:0}
.row .m{color:var(--mute);font-size:13px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.mode{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px;text-align:left;font:inherit;cursor:pointer}
.mode b{display:block}
.mode span{color:var(--mute);font-size:13px}
.mode[aria-pressed="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:14px;font:600 16px inherit;font-family:inherit;background:var(--acc);color:var(--accfg);cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.opt{display:flex;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px 14px;margin-bottom:8px;font:inherit;cursor:pointer}
.opt .l{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--mute)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.ok .l{background:var(--ok);color:var(--bg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt.bad .l{background:var(--bad);color:var(--bg);border-color:var(--bad)}
.opt.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.opt:disabled{cursor:default;color:var(--ink)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.top button{border:0;background:none;color:var(--acc);font:inherit;cursor:pointer;padding:6px 0}
.top .c{margin-left:auto;color:var(--mute);font-size:14px}
.q{font:500 20px/1.4 Georgia,"Times New Roman",serif;margin:18px 0}
.note{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:14px;margin:10px 0}
.topic{color:var(--mute);font-size:13px}
.score{font:600 44px/1 Georgia,serif;margin:12px 0 4px}
.wr{border-top:1px solid var(--line);padding:12px 0}
.wr p{margin:0 0 6px}
.wr .a{color:var(--ok)}
.wr .y{color:var(--bad)}
.gap{height:10px}
.ctx{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:15px}
.acc{color:var(--ok);font-weight:600;font-size:14px;margin-left:auto}
.acc + .c{margin-left:12px}
.opt.multi .l{border-radius:6px}
.opt.sel .l{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.sw{display:flex;gap:8px;align-items:center;margin:4px 0 14px;color:var(--mute);font-size:14px;cursor:pointer}
.sw input{width:18px;height:18px;accent-color:var(--acc)}
.rst{background:none;border:0;color:var(--mute);font:inherit;text-decoration:underline;cursor:pointer;margin-top:18px;padding:0}
</style>
</head>

ки?","o":["Намеренное изменение почерка путем выполнения рукописи непривычной к письму (левой) рукой.","Выполнение рукописи лицом пожилого возраста.","Выполнение рукописи под влиянием внешних условий письма.","Выполнение рукописи в необычном функциональном состоянии."],"a":[0,2,3],"g":0},{"id":"hw-710","k":"hw","n":2,"sec":"Кейс 2","ctx":"Сотрудником УДП был составлен протокол об административном правонарушении в отношении гр. К. 1974 года рождения. Гр. К обратился в правоохранительные органы с заявлением на противоправные действия, совершенные в отношении него сотрудником УДП, утверждая, что в протоколе об административном правонарушении не писал и документ не подписывал. В связи с данным фактом для установления истины по делу была назначена судебно-почерковедческая экспертиза.","q":"При каких условиях нельзя применить количественную методику установления факта выполнения рукописи непривычной левой рукой?","o":["Текст выполнен намеренно измененным стилизованным почерком.","Текст выполнен скорописным почерком.","Текст выполнен средневыработанным почерком.","Текст выполнен высоковыработанным почерком."],"a":[0,3],"g":0},{"id":"hw-711","k":"hw","n":3,"sec":"Кейс 2","ctx":"Сотрудником УДП был составлен протокол об административном правонарушении в отношении гр. К. 1974 года рождения. Гр. К обратился в правоохранительные органы с заявлением на противоправные действия, совершенные в отношении него сотрудником УДП, утверждая, что в протоколе об административном правонарушении не писал и документ не подписывал. В связи с данным фактом для установления истины по делу была назначена судебно-почерковедческая экспертиза.","q":"При обращении с объектами судебно-почерковедческого исследования допускается:","o":["Исследовать с помощью устройства с различными светофильтрами.","Подчеркивать либо выделять слова.","Фотографировать, сканировать.","Делать необходимые для исследования пометки."],"a":[0,2],"g":0},{"id":"hw-712","k":"hw","n":4,"sec":"Кейс 2","ctx":"Сотрудником УДП был сос const KEY = "exam_trainer_hw_ted_v1";
let P = {right:{}, wrong:{}};
try { const s = localStorage.getItem(KEY); if (s) P = JSON.parse(s); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch(e) {} };
const $app = document.getElementById("app");
const byId = {}; DATA.qs.forEach(q => byId[q.id] = q);
const tname = {}; DATA.topics.forEach(t => tname[t.k] = t.t);
const L = "ABCDEFG";
const cfg = { sel: new Set(DATA.topics.map(t => t.k)), mode: "order", instant: true };
let run = null;

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function home() {
  run = null;
  const done = DATA.qs.filter(q => P.right[q.id] || P.wrong[q.id]).length;
  const wrongN = DATA.qs.filter(q => P.wrong[q.id]).length;
  const rightN = DATA.qs.filter(q => P.right[q.id]).length;
  const pool = DATA.qs.filter(q => cfg.sel.has(q.k));
  const mp = cfg.mode === "wrong" ? pool.filter(q => P.wrong[q.id]) : pool;
  const cnt = cfg.mode === "exam" ? Math.min(20, mp.length) : mp.length;
  let h = `<h1>Подготовка к тесту</h1><p class="sub">${DATA.qs.length} вопросов, ${DATA.topics.length} тем. Пройдено ${done}, верно ${pct(rightN, done)}%, в ошибках ${wrongN}.</p><div class="card">`;
  DATA.topics.forEach(t => {
    const r = DATA.qs.filter(q => q.k === t.k && P.right[q.id]).length;
    const w = DATA.qs.filter(q => q.k === t.k && P.wrong[q.id]).length;
    h += `<label class="row"><input type="checkbox" data-k="${t.k}" ${cfg.sel.has(t.k) ? "checked" : ""}><div class="t">${esc(t.t)}<div class="m">${t.n} вопр. · верно ${r} · ошибок ${w}${r + w ? " · точность " + pct(r, r + w) + "%" : ""}</div><div class="bar"><i style="width:${Math.round(100 * r / t.n)}%"></i></div></div></label>`;
  });
  h += `</div><div class="modes">`;
  [["order","По порядку","Как в файле"],["shuffle","Вперемешку","Все выбранные темы"],["wrong","Работа над ошибками","Только то, где ошибался"],["exam","Пробный тест","20 случайных, как на тесте"]].forEach(m => {
    h += `<button class="mode" data-m="${m[0]}" aria-pressed="${cfg.mode === m[0]}"><b>${m[1]}</b><span>${m[2]}</span></button>`;
  });
  h += `</div><label class="sw"><input type="checkbox" id="inst" ${cfg.instant && cfg.mode !== "exam" ? "checked" : ""} ${cfg.mode === "exam" ? "disabled" : ""}>Показывать правильный ответ сразу</label>`;
  h += `<button class="btn" id="go" ${cnt ? "" : "disabled"}>${cnt ? "Начать: " + cnt + " вопр." : (cfg.mode === "wrong" ? "Ошибок пока нет" : "Выбери хотя бы одну тему")}</button>`;
  h += `<button class="rst" id="rst">Сбросить прогресс</button>`;
  $app.innerHTML = h;
  $app.querySelectorAll("[data-k]").forEach(e => e.onchange = () => { e.checked ? cfg.sel.add(e.dataset.k) : cfg.sel.delete(e.dataset.k); home(); });
  $app.querySelectorAll("[data-m]").forEach(e => e.onclick = () => { cfg.mode = e.dataset.m; home(); });
  const inst = document.getElementById("inst"); inst.onchange = () => cfg.instant = inst.checked;
  document.getElementById("go").onclick = start;
  document.getElementById("rst").onclick = () => { if (confirm("Стереть весь прогресс и список ошибок?")) { P = {right:{}, wrong:{}}; save(); home(); } };
  window.scrollTo(0, 0);
}

function start(ids) {
  let list;
  if (Array.isArray(ids)) list = ids.map(i => byId[i]);
  else {
    list = DATA.qs.filter(q => cfg.sel.has(q.k));
    if (cfg.mode === "wrong") list = list.filter(q => P.wrong[q.id]);
    if (cfg.mode !== "order") list = shuffle(list);
    if (cfg.mode === "exam") list = list.slice(0, 20);
  }
  run = { list, i: 0, picked: null, results: [], sel: [], instant: Array.isArray(ids) ? true : (cfg.mode === "exam" ? false : cfg.instant) };
  quiz();
}

const isOk = (q, r) => Array.isArray(r) && r.length === q.a.length && q.a.every(x => r.includes(x));
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const label = q => tname[q.k] + (q.sec ? ", " + q.sec : "") + ", вопрос " + q.n;

function quiz() {
  const q = run.list[run.i], r = run.results[run.i], multi = q.a.length > 1;
  const shown = run.instant && r !== undefined;
  const dn = run.results.filter(x => x !== undefined).length;
  const okN = run.results.filter((x, j) => x !== undefined && isOk(run.list[j], x)).length;
  let h = `<div class="top"><button id="back">‹ Выйти</button>${run.instant && dn ? `<span class="acc">верно ${pct(okN, dn)}%</span>` : ""}<span class="c">${run.i + 1} / ${run.list.length}</span></div><div class="bar"><i style="width:${pct(run.i, run.list.length)}%"></i></div>`;
  h += `<div class="topic" style="margin-top:14px">${esc(label(q))}</div>`;
  if (q.ctx) h += `<div class="ctx">${esc(q.ctx)}</div>`;
  h += `<div class="q">${esc(q.q)}</div>`;
  if (multi) h += `<div class="topic">Несколько верных ответов: отметьте все и нажмите «${run.instant ? "Проверить" : "Ответить"}»</div>`;
  if (q.g) h += `<div class="note">${esc(q.gn || "В исходном файле у этого вопроса ответ не отмечен. Показан наиболее вероятный вариант, лучше перепроверить по кодексу.")}</div>`;
  q.o.forEach((o, i) => {
    let c = "opt" + (multi ? " multi" : "");
    if (shown) { if (q.a.includes(i)) c += " ok"; else if (r.includes(i)) c += " bad"; }
    else if (run.sel.includes(i)) c += " sel";
    h += `<button class="${c}" data-i="${i}" ${shown ? "disabled" : ""}><span class="l">${L[i]}</span><span>${esc(o)}</span></button>`;
  });
  h += `<div class="gap"></div>`;
  if (r === undefined) {
    if (multi) h += `<button class="btn" id="chk">${run.instant ? "Проверить" : "Ответить"}</button><div class="gap"></div>`;
    h += `<button class="btn alt" id="show">${run.instant ? "Показать ответ" : "Пропустить"}</button>`;
  } else h += `<button class="btn" id="next">${run.i === run.list.length - 1 ? "Завершить" : "Дальше"}</button>`;
  $app.innerHTML = h;
  document.getElementById("back").onclick = () => { if (confirm("Выйти? Результаты этого захода сохранятся.")) home(); };
  $app.querySelectorAll(".opt").forEach(e => e.onclick = () => {
    const i = +e.dataset.i;
    if (!multi) return answer([i]);
    const k = run.sel.indexOf(i); k < 0 ? run.sel.push(i) : run.sel.splice(k, 1);
    e.classList.toggle("sel");
  });
  const ck = document.getElementById("chk"); if (ck) ck.onclick = () => answer(run.sel.slice().sort());
  const sh = document.getElementById("show"); if (sh) sh.onclick = () => answer([]);
  const nx = document.getElementById("next"); if (nx) nx.onclick = next;
  if (r === undefined) window.scrollTo(0, 0);
}

function answer(sel) {
  if (run.results[run.i] !== undefined && run.instant) return;
  const q = run.list[run.i];
  run.results[run.i] = sel; run.sel = [];
  if (isOk(q, sel)) { P.right[q.id] = 1; delete P.wrong[q.id]; } else { P.wrong[q.id] = 1; delete P.right[q.id]; }
  save();
  if (run.instant) quiz(); else next();
}

function next() {
  run.sel = [];
  if (run.i < run.list.length - 1) { run.i++; quiz(); } else finish();
}

function finish() {
  const bad = run.list.filter((q, i) => !isOk(q, run.results[i]));
  const ok = run.list.length - bad.length;
  let h = `<h1>Результат</h1><div class="score">${pct(ok, run.list.length)}%</div><p class="sub">Верно ${ok} из ${run.list.length}.${bad.length ? "" : " Ошибок нет."}</p>`;
  if (bad.length) h += `<button class="btn" id="redo">Повторить ошибки (${bad.length})</button><div class="gap"></div>`;
  h += `<button class="btn alt" id="home">На главную</button>`;
  bad.forEach(q => {
    const y = run.results[run.list.indexOf(q)] || [];
    h += `<div class="wr"><div class="topic">${esc(label(q))}</div>${q.ctx ? `<div class="ctx">${esc(q.ctx)}</div>` : ""}<p>${esc(q.q)}</p>${y.length ? `<p class="y">Твой ответ: ${y.map(k => L[k] + ") " + esc(q.o[k])).join("; ")}</p>` : `<p class="y">Ответ не выбран</p>`}<p class="a">Верно: ${q.a.map(k => L[k] + ") " + esc(q.o[k])).join("; ")}</p></div>`;
  });
  $app.innerHTML = h;
  const re = document.getElementById("redo"); if (re) re.onclick = () => start(shuffle(bad.map(q => q.id)));
  document.getElementById("home").onclick = home;
  window.scrollTo(0, 0);
}

document.addEventListener("keydown", e => {
  if (!run || !document.getElementById("back")) return;
  const nx = document.getElementById("next"), ck = document.getElementById("chk");
  if (e.key === "Enter" || e.key === "ArrowRight") { if (nx) nx.click(); else if (ck) ck.click(); return; }
  const idx = "1234567".indexOf(e.key);
  if (idx < 0 || nx) return;
  const b = $app.querySelector('.opt[data-i="' + idx + '"]'); if (b) b.click();
});
home();
</script>
</body>
</html>
